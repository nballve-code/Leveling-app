name: Blue tracker + publicar app

# Diseñado para ser liviano y no parecer automatización abusiva:
# - corre cada 30 minutos (no cada 15);
# - NO hace commits: el estado anterior se lee del propio sitio publicado;
# - solo republica la página cuando hay datos nuevos.

on:
  schedule:
    - cron: "11,41 * * * *"   # cada 30 min, en minutos poco congestionados
  workflow_dispatch:
    inputs:
      test_push:
        description: "Mandar push de prueba al teléfono"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["app/**", "scripts/**", ".github/workflows/update-feeds.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      APP_URL: ${{ vars.APP_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Traer el estado anterior desde el sitio publicado
        run: node scripts/restore-state.mjs

      - name: Buscar posts azules y noticias
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_REGIONS: ${{ vars.NOTIFY_REGIONS || 'us' }}
          NOTIFY_ALL: ${{ vars.NOTIFY_ALL || '0' }}
          TEST_PUSH: ${{ inputs.test_push || false }}
        run: node scripts/fetch-feeds.mjs

      - name: Actualizar personaje (Battle.net API)
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: node scripts/fetch-character.mjs

      - name: ¿Hay algo nuevo?
        id: diff
        run: |
          changed=false
          for f in blues.json news.json character.json; do
            [ -f "app/data/$f" ] || continue   # no existe (ej. personaje sin configurar)
            if ! cmp -s "app/data/$f" "$RUNNER_TEMP/prev/$f"; then changed=true; fi
          done
          if [ "${{ github.event_name }}" != "schedule" ]; then changed=true; fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Cambios: $changed"

      - if: steps.diff.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - if: steps.diff.outputs.changed == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
